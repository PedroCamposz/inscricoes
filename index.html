<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscrição no evento</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="pagina">
    <h1>Inscrição no evento</h1>
    <p class="intro">Preencha seus dados e escolha o estado e a cidade.</p>

    <p id="mensagem" class="mensagem" role="alert" hidden></p>

    <form id="inscricao" class="formulario">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" required autocomplete="name">
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="email">
      </div>

      <div class="campo">
        <label for="estado">Estado</label>
        <select id="estado" required>
          <option value="">Carregando...</option>
        </select>
      </div>

      <div class="campo">
        <label for="filtro">Buscar cidade</label>
        <input type="text" id="filtro" placeholder="Digite para filtrar a lista" autocomplete="off" disabled>
      </div>

      <div class="campo">
        <label for="cidade">Cidade</label>
        <select id="cidade" required disabled>
          <option value="">Escolha um estado primeiro</option>
        </select>
        <p id="contagem" class="contagem" aria-live="polite"></p>
      </div>

      <button type="submit">Inscrever</button>
    </form>

    <section id="resumo" class="resumo" role="status" hidden></section>
  </main>
</body>
</html>
